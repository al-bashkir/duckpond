[package]
name = "duckpond"
version = "0.1.0"
edition = "2024"

[dependencies]
age = "0.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }
clap = { version = "4.6.9", features = ["derive"] }
clap_complete = { version = "4.6.12", features = ["unstable-dynamic"] }
inquire = { version = "0.9.5", default-features = false, features = ["crossterm"] }
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

[profile.dev.package."*"]
opt-level = 2
