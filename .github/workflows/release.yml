name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl # static: runs on any Linux distribution
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl # native arm64 runner: no cross toolchain
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must match the Cargo.toml version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="duckpond-$GITHUB_REF_NAME-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/duckpond" README.md LICENSE "$name/"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: duckpond-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
    steps:
      # Every artifact of the run, each in a directory with its name.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      # Publish exactly one tarball per build target: a missing target or any other
      # artifact (for example one uploaded by a step of the ci job) stops the release.
      - name: Take the build job's tarballs
        run: |
          mkdir dist
          # The targets of the build matrix.
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin; do
            mv "artifacts/$target/duckpond-$GITHUB_REF_NAME-$target.tar.gz" dist/
          done
          left=$(find artifacts -type f)
          if [ -n "$left" ]; then
            printf 'Not from the build job, or a target missing above:\n%s\n' "$left"
            exit 1
          fi
      - name: Create the GitHub release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum -- *.tar.gz > SHA256SUMS
          # --verify-tag: never let gh create the tag; it must already exist on GitHub.
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --generate-notes -- *.tar.gz SHA256SUMS
