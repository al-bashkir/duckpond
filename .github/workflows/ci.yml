name: CI

on:
  push:
    # Branches only: path filters do not apply to tag pushes, and tags run release.yml.
    branches: ["**"]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/ci.yml"
  workflow_call: # release.yml runs the same checks before it builds

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install zsh for the shell integration tests
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # CI is set on GitHub runners: tests that need gpg, zsh or bash fail instead of skipping.
      - run: cargo test --locked

  # RustSec advisories for Cargo.lock; ignores (with reasons) are in .cargo/audit.toml.
  # Plain cargo-audit: needs no token and no write permission.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit
      - run: cargo audit
